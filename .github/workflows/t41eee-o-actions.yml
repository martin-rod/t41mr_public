name: t41eee_o-actions
run-name: ${{ github.actor }} t41eee-o-actions

on:
  workflow_dispatch:
  push:
    branches: [master,devel]

jobs:
  create_version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          repository: martin-rod/t41mr_public
          fetch-depth: 0
      - name: create_version
        run: |
          ./create_git_version.sh
      - name: List version artifacts
        run: |
          ls -l version/git_version.sh
          ls -l version/git_version.h
      - name: Upload version artifacts
        uses: actions/upload-artifact@v4
        with:
          name: version_artifact
          retention-days: 14
          path: |
            version/git_version.sh
            version/git_version.h

  build_t41_eee:
    #if: ${{ false }}
    needs: create_version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          repository: martin-rod/t41mr_public
          # repository: martin-rod/t41mr
      - name: Git submodule update
        run: |
          git submodule update --init --recursive
      - name: Download version artifacts
        uses: actions/download-artifact@v4
        with:
          name: version_artifact
          path: version
      - name: Cat version artifacts
        run: |
          cat version/git_version.sh
          cat version/git_version.h
      - name: Build t41_eee
        run: |
          echo "Build t41_eee"
          ./create_build_eee_o.sh
          cd build_eee_o
          make VERBOSE=1
      - name: Upload t41_eee artifacts
        uses: actions/upload-artifact@v4
        with:
          name: t41_eee_artifact
          retention-days: 14
          path: |
            build_eee_o/t41sdt
            build_eee_o/t41sdt.hex
